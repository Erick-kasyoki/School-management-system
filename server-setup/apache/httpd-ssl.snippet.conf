# XAMPP (Windows) — C:\xampp\apache\conf\extra\httpd-ssl.conf   (edit the lines that already exist there)
#
# In C:\xampp\apache\conf\httpd.conf make sure these are NOT commented out (no leading #):
#   LoadModule ssl_module modules/mod_ssl.so
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule headers_module modules/mod_headers.so
#   Include conf/extra/httpd-ssl.conf
# and that the htdocs <Directory> block has  AllowOverride All  (needed for the .htaccess files).
# In C:\xampp\php\php.ini:  extension=openssl   (and  extension=pdo_pgsql / pgsql  as before)

Listen 443

SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder     off
SSLSessionTickets       off

<VirtualHost _default_:443>
    DocumentRoot "C:/xampp/htdocs"
    # use your real domain name here once the site is public
    ServerName localhost:443
    SSLEngine on
    # LOCAL TESTING — trusted by your own browser, made with mkcert (see SECURITY-SETUP.md §5):
    SSLCertificateFile    "C:/xampp/apache/conf/ssl.crt/localhost.pem"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/localhost-key.pem"
    # PUBLIC SERVER — use the certificate from Let's Encrypt instead (win-acme / certbot).
</VirtualHost>
